<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Paxi 专业工具箱 · Pro Suite</title>
  <meta name="description" content="Paxi Network 专业化工具集：链上解码 · 发币 · 燃烧 · 转账 · 质押 · 治理">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236366f1'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>P</text></svg>">
  <style>
    /* ========== 全局样式 ========== */
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overscroll-behavior-y: none;
    }

    /* ========== Header ========== */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 6px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .header-badge {
      font-size: 10px;
      background: var(--primary);
      color: white;
      padding: 1px 7px;
      border-radius: 100px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .header-right .wallet-balance {
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
      white-space: nowrap;
    }
    .header-right .wallet-address {
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 3px 6px;
      border-radius: 4px;
      font-family: monospace;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-right select {
      font-size: 10px;
      padding: 3px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      max-width: 60px;
    }
    .lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    .lang-btn:active { background: var(--bg-hover); }
    .btn-sm {
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
      min-height: 28px;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-chain { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; }
    .btn-chain:active { background: linear-gradient(135deg, #0284c7, #1d4ed8); }
    .btn-chain:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 6px; line-height: 1.5; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:active { background: var(--bg-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ========== Main ========== */
    .main {
      max-width: 500px;
      margin: 0 auto;
      padding: 12px 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
    }

    /* ========== 首页网格 ========== */
    .home-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .tool-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 72px;
      justify-content: center;
    }
    .tool-card:active { background: var(--bg-hover); transform: scale(0.97); }
    .tool-card .icon { font-size: 22px; line-height: 1.2; }
    .tool-card .name { font-size: 11px; font-weight: 600; line-height: 1.3; }
    .home-search { position: relative; margin-bottom: 6px; }
    .home-search input { width: 100%; padding: 12px 38px 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 14px; box-sizing: border-box; }
    .home-search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 14px; }
    .home-cat { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 18px 4px 8px; letter-spacing: .5px; }
    .home-cat-icon { margin-right: 6px; }
    .home-empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }

    /* ========== 二级页面返回栏 ========== */
    .back-bar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 12px;
      cursor: pointer;
      padding: 6px 0;
    }
    .back-bar:active { color: var(--text); }

    /* ========== 工具卡片（内部） ========== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .info-box {
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .info-box strong { color: var(--primary); }

    /* ========== Form ========== */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: monospace;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--primary); }
    textarea { min-height: 100px; resize: vertical; font-family: sans-serif; }
    select { cursor: pointer; font-family: sans-serif; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 400px) { .form-row { grid-template-columns: 1fr; } }

    /* ========== Buttons ========== */
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-block { width: 100%; }

    /* ========== Status ========== */
    .status-msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
      display: none;
      word-break: break-word;
    }
    .status-msg.success { background: rgba(34,197,94,0.15); color: var(--success); display: block; }
    .status-msg.error { background: rgba(239,68,68,0.15); color: var(--danger); display: block; }
    .status-msg.info { background: rgba(99,102,241,0.15); color: var(--primary); display: block; }
    .status-msg.warning { background: rgba(245,158,11,0.15); color: var(--warning); display: block; }

    /* ========== Stats ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }

    /* ========== Tabs ========== */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab {
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .tab:active { color: var(--text); }
    .tab.active { color: var(--primary); background: rgba(99,102,241,0.15); border-color: var(--primary); }

    /* ========== Table ========== */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left;
      padding: 6px 8px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    td { padding: 6px 8px; border-bottom: 1px solid var(--border); }

    /* ========== Upload ========== */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-muted);
    }
    .upload-area:active { border-color: var(--primary); color: var(--text); }
    .upload-area.dragover { border-color: var(--primary); background: rgba(99,102,241,0.08); }

    /* ========== Spinner ========== */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      animation: slideUp 0.3s ease;
      box-shadow: var(--shadow);
      max-width: 90vw;
      text-align: center;
    }
    @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* ========== Misc ========== */
    code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--primary); }
    .sub-tabs {
      display: flex;
      gap: 0;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 4px;
    }
    .sub-tab {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .sub-tab.active { color: var(--text); background: var(--bg-hover); }
    .nft-market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .nft-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .nft-card-img {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .nft-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .nft-card-placeholder { font-size: 32px; color: var(--text-muted); }
    .nft-card-body { padding: 10px; }
    .nft-card-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nft-card-meta { font-size: 10px; color: var(--text-muted); }
    .nft-card-price { font-size: 14px; font-weight: 800; color: var(--primary); margin: 4px 0; }
    .nft-card-seller { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
    .nft-card-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(99,102,241,0.15); }
    .listing-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }
    .listing-item-main { flex: 1; min-width: 140px; }
    .listing-item-name { font-weight: 700; font-size: 13px; }
    .listing-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .listing-item-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .buy-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 16px;
    }
    .buy-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .buy-step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--text-muted);
    }
    .buy-step.active .buy-step-num { border-color: var(--primary); color: var(--primary); }
    .buy-step.done .buy-step-num { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.15); }
    .buy-step-label { font-size: 10px; color: var(--text-muted); }
    .buy-step.active .buy-step-label { color: var(--primary); }
    .buy-step-line { flex: 1; height: 2px; background: var(--border); max-width: 30px; }
    .buy-step-line.done { background: var(--success); }
    .price-breakdown {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }
    .price-row.total {
      border-top: 1px solid var(--border);
      margin-top: 4px;
      padding-top: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .copy-box { margin-bottom: 12px; }
    .copy-row { display: flex; gap: 6px; align-items: center; }
    .nft-preview-box {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
    }
    .nft-buy-detail { text-align: center; margin-bottom: 16px; }


    /* ========== Mobile ========== */
    @media (max-width: 767px) {
      .header { padding: 6px 12px; gap: 4px; }
      .header-left { width: 100%; justify-content: center; }
      .header-right {
        width: 100%;
        justify-content: center;
        flex-wrap: nowrap;      /* 禁止再换行，避免"断开"单独占第三行 */
        overflow-x: auto;       /* 实在太窄时横向滚动而不是换行 */
        gap: 4px;
        -webkit-overflow-scrolling: touch;
      }
      .header-right > * {
        flex-shrink: 0;         /* 按钮等控件不被压缩到文字截断 */
      }
      .header-title { font-size: 14px; }
      .logo { width: 26px; height: 26px; font-size: 13px; border-radius: 6px; }
      .header-badge { font-size: 9px; padding: 1px 5px; }
      .header-right .wallet-balance { font-size: 10px; }
      .header-right .wallet-address { max-width: 54px; font-size: 9px; padding: 2px 4px; }
      .header-right select { font-size: 9px; padding: 2px 4px; max-width: 52px; }
      .lang-btn { font-size: 9px; padding: 2px 5px; }
      .btn-sm { padding: 3px 8px; font-size: 10px; min-height: 24px; }
    }
    /* ========== Desktop ========== */
    @media (min-width: 768px) {
      .home-grid { grid-template-columns: repeat(4, 1fr); }
      .nft-market-grid { grid-template-columns: repeat(3, 1fr); }
      .main { padding: 20px 16px; }
      .header-title { font-size: 17px; }
      .tool-card { padding: 18px 10px; min-height: 80px; }
      .tool-card .icon { font-size: 26px; }
      .tool-card .name { font-size: 13px; }
    }
    @media (max-width: 360px) {
      .home-grid { gap: 8px; }
      .tool-card { padding: 12px 4px; min-height: 68px; }
      .tool-card .icon { font-size: 20px; }
      .tool-card .name { font-size: 10px; }
      .header-right .wallet-address { max-width: 42px; font-size: 8px; }
      .header-right select { max-width: 40px; font-size: 8px; }
      .lang-btn { font-size: 8px; padding: 2px 4px; }
      .btn-sm { padding: 2px 6px; font-size: 9px; min-height: 22px; }
      .header-right .wallet-balance { font-size: 9px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-left">
    <div class="logo">P</div>
    <div>
      <div class="header-title" id="appTitle">Paxi 专业工具箱</div>
    </div>
    <span class="header-badge">Pro 1.0</span>
  </div>
  <div class="header-right">
    <span class="wallet-balance" id="walletBalance" style="display:none"></span>
    <span class="wallet-address" id="walletAddress" style="display:none"></span>
    <span id="networkSelector"></span>
    <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">中/english</button>
    <button class="btn btn-primary btn-sm" id="btnConnect" onclick="connectWallet()">连接钱包</button>
    <button class="btn btn-outline btn-sm" id="btnDisconnect" style="display:none" onclick="disconnectWallet()">断开</button>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="main" id="mainContent">
  <!-- 动态渲染 -->
</main>

<!-- ===== SCRIPTS ===== -->
<script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js"></script>
<script src="shared.js"></script>
<script src="compat.js"></script>
<!-- 核心模块（语言/状态/钱包/首页） -->
<script src="appjs/core.js"></script>
<!-- 工具模块（按顺序加载，互不依赖） -->
<script src="appjs/tools/batch-transfer.js"></script>
<script src="appjs/tools/balance-check.js"></script>
<script src="appjs/tools/tx-gas.js"></script>
<script src="appjs/tools/address-convert.js"></script>
<script src="appjs/tools/validator-compare.js"></script>
<script src="appjs/tools/redelegate.js"></script>
<!-- <script src="appjs/tools/nft-market.js"></script> -->
<script src="appjs/tools/proposal.js"></script>
<!-- 新增工具模块（质押/治理/委托/地址簿/IBC/交易模拟） -->
<script src="appjs/tools/claim-rewards.js"></script>
<script src="appjs/tools/gov-vote.js"></script>
<script src="appjs/tools/stake-manage.js"></script>
<script src="appjs/tools/address-book.js"></script>
<script src="appjs/tools/ibc-query.js"></script>
<script src="appjs/tools/tx-dryrun.js"></script>
<script src="appjs/tools/allowance.js"></script>
<script src="appjs/tools/swap.js"></script>
<!-- 游戏模块（合规移除，未整合）
-->
<!-- 链上解码器（核心引擎 + 界面模块） -->
<script src="decoder-core.js"></script>
<script src="appjs/tools/decoder.js"></script>
<!-- 定制化发币 -->
<script src="appjs/tools/pump.js"></script>
<!-- 代币燃烧器 -->

<!-- 主入口（路由 + 初始化） -->
<script src="app.js"></script>
<script>
  // 初始化网络选择器（主网/测试网）
  renderNetworkSelector('networkSelector');

  // 首页底部：整站统一免责声明（中英双语）
  (function () {
    try {
      const disclaimerZH = '⚠️ 本网站（及所有子页面）仅供链上数据查询和钱包操作辅助使用。<br>不提供任何代币兑换、交易撮合、定价指引或信息中介服务。<br>用户的一切链上操作均为自主行为，与本网站无关。<br>所有信息不构成任何投资建议，代币价值波动风险由用户自行承担。<br>请遵守您所在国家或地区的法律法规。';
      const disclaimerEN = '⚠️ This website (and all subpages) is for on-chain data query and wallet assistance only.<br>No token exchange, trading, pricing, or intermediary services are provided.<br>All on-chain actions are your own responsibility. No investment advice is provided; token price volatility risk is borne by the user.<br>Please comply with the laws of your jurisdiction.';
      function getLang() { return localStorage.getItem('paxi_lang') || 'zh'; }
      function render() {
        let el = document.getElementById('siteDisclaimer');
        if (!el) {
          el = document.createElement('div');
          el.id = 'siteDisclaimer';
          el.setAttribute('style', 'max-width:500px;margin:20px auto 0;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--text-muted);line-height:1.8;text-align:center;');
          const mainEl = document.getElementById('mainContent');
          if (mainEl && mainEl.parentNode) mainEl.parentNode.insertBefore(el, mainEl.nextSibling);
          else document.body.appendChild(el);
        }
        el.innerHTML = getLang() === 'zh' ? disclaimerZH : disclaimerEN;
      }
      render();
      const origToggle = window.toggleLanguage;
      window.toggleLanguage = function () { if (origToggle) origToggle(); setTimeout(render, 0); };
    } catch (e) { console.warn('disclaimer render failed:', e); }
  })();
</script>
</body>
</html>
