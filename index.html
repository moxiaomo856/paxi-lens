<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Paxi 工具箱 - 批量转账 · NFT市场 · 更多</title>
  <meta name="description" content="Paxi Network 生态工具集：批量转账、NFT市场、余额查询、交易追踪、Gas计算、地址转换、验证节点对比、PRC-721 NFT发射">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236366f1'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>P</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --tab-bar-height: 60px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overscroll-behavior-y: none;
    }

    /* ============ Header ============ */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .header-badge {
      font-size: 10px;
      background: var(--primary);
      color: white;
      padding: 1px 7px;
      border-radius: 100px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* ============ Wallet ============ */
    .wallet-area { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .wallet-balance { font-size: 12px; font-weight: 600; color: var(--success); white-space: nowrap; }
    .wallet-address {
      font-size: 11px; color: var(--text-muted);
      background: var(--bg); padding: 4px 8px;
      border-radius: 6px; font-family: monospace;
      max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ============ Buttons ============ */
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:active { background: var(--bg-hover); }
    .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 32px; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ============ Main Content ============ */
    .main {
      max-width: 500px;
      margin: 0 auto;
      padding: 12px 16px;
      padding-bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + 24px);
    }

    /* ============ Bottom Tab Bar ============ */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      padding-bottom: var(--safe-bottom);
      max-width: 500px;
      margin: 0 auto;
    }
    .tab-bar-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 4px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      min-height: 48px;
      justify-content: center;
      transition: color 0.15s;
    }
    .tab-bar-item:active { color: var(--primary); }
    .tab-bar-item.active { color: var(--primary); }
    .tab-bar-icon { font-size: 20px; line-height: 1; }
    .tab-bar-label { font-size: 10px; }

    /* ============ Cards ============ */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ============ Form ============ */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      font-family: monospace;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      border-radius: 8px;
    }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { min-height: 120px; resize: vertical; }
    select { cursor: pointer; font-family: sans-serif; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ============ Upload Area ============ */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-muted);
    }
    .upload-area:active { border-color: var(--primary); color: var(--text); }
    .upload-area.dragover { border-color: var(--primary); background: rgba(99,102,241,0.1); }

    /* ============ Table ============ */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left;
      padding: 8px 10px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    tr:active td { background: rgba(99,102,241,0.05); }

    /* ============ Status ============ */
    .status-msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
      display: none;
      word-break: break-word;
    }
    .status-msg.success { background: rgba(34,197,94,0.15); color: var(--success); display: block; }
    .status-msg.error { background: rgba(239,68,68,0.15); color: var(--danger); display: block; }
    .status-msg.info { background: rgba(99,102,241,0.15); color: var(--primary); display: block; }
    .status-msg.warning { background: rgba(245,158,11,0.15); color: var(--warning); display: block; }

    /* ============ Stats ============ */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .stat-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ============ Tabs ============ */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab {
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .tab:active { color: var(--text); }
    .tab.active { color: var(--primary); background: rgba(99,102,241,0.15); border-color: var(--primary); }

    /* ============ Sub Tabs (NFT Market) ============ */
    .sub-tabs {
      display: flex;
      gap: 0;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 4px;
    }
    .sub-tab {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .sub-tab.active { color: var(--text); background: var(--bg-hover); }

    /* ============ More Panel Grid ============ */
    .more-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .more-tool-card {
      background: var(--bg);
      border-radius: 10px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .more-tool-card:active { background: var(--bg-hover); }
    .more-tool-icon { font-size: 24px; }
    .more-tool-name { font-size: 11px; font-weight: 600; }
    .more-tool-desc { font-size: 9px; color: var(--text-muted); }

    /* ============ NFT Market Cards ============ */
    .nft-market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .nft-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .nft-card-img {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .nft-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .nft-card-placeholder { font-size: 32px; color: var(--text-muted); }
    .nft-card-body { padding: 10px; }
    .nft-card-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nft-card-meta { font-size: 10px; color: var(--text-muted); }
    .nft-card-price { font-size: 14px; font-weight: 800; color: var(--primary); margin: 4px 0; }
    .nft-card-seller { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
    .nft-card-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(99,102,241,0.15); }

    /* ============ Listing Items ============ */
    .listing-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }
    .listing-item-main { flex: 1; min-width: 140px; }
    .listing-item-name { font-weight: 700; font-size: 13px; }
    .listing-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .listing-item-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

    /* ============ Buy Flow ============ */
    .back-bar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 12px;
      cursor: pointer;
      padding: 6px 0;
    }
    .back-bar:active { color: var(--text); }
    .nft-buy-detail { text-align: center; margin-bottom: 16px; }
    .price-breakdown {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }
    .price-row.total {
      border-top: 1px solid var(--border);
      margin-top: 4px;
      padding-top: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .buy-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 16px;
    }
    .buy-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .buy-step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--text-muted);
    }
    .buy-step.active .buy-step-num { border-color: var(--primary); color: var(--primary); }
    .buy-step.done .buy-step-num { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.15); }
    .buy-step-label { font-size: 10px; color: var(--text-muted); }
    .buy-step.active .buy-step-label { color: var(--primary); }
    .buy-step-line { flex: 1; height: 2px; background: var(--border); max-width: 30px; }
    .buy-step-line.done { background: var(--success); }
    .buy-step-content { margin-top: 8px; }
    .copy-box { margin-bottom: 12px; }
    .copy-row { display: flex; gap: 6px; align-items: center; }
    .nft-preview-box {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
    }
    .info-box {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
    }
    .info-box strong { color: var(--primary); }

    /* ============ Spinner ============ */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      animation: slideUp 0.3s ease;
      box-shadow: var(--shadow);
      max-width: 90vw;
      text-align: center;
    }
    @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* ============ Misc ============ */
    .tool-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: var(--primary); }
    .steps { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .step {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg); border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--text-muted);
    }
    .step.active { border-color: var(--primary); color: var(--primary); background: rgba(99,102,241,0.15); }
    .step.done { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.15); }
    .step-line { flex: 1; height: 2px; background: var(--border); max-width: 40px; }
    .step-line.done { background: var(--success); }

    /* ============ Desktop (min-width: 768px) ============ */
    @media (min-width: 768px) {
      .main { padding: 20px 16px; }
      .card { padding: 20px; }
      .nft-market-grid { grid-template-columns: repeat(3, 1fr); }
      .more-grid { grid-template-columns: repeat(4, 1fr); }
      .header-title { font-size: 17px; }
    }

    /* ============ Small phones ============ */
    @media (max-width: 360px) {
      .nft-market-grid { grid-template-columns: 1fr; }
      .more-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">P</div>
      <div>
        <div class="header-title">Paxi 工具箱</div>
      </div>
      <span class="header-badge">Beta</span>
    </div>
    <div class="wallet-area">
      <span class="wallet-balance" id="walletBalance" style="display:none"></span>
      <span class="wallet-address" id="walletAddress" style="display:none"></span>
      <span id="networkSelector"></span>
      <button class="btn btn-primary btn-sm" id="btnConnect" onclick="connectWallet()">
        🔌 连接
      </button>
      <button class="btn btn-outline btn-sm" id="btnDisconnect" style="display:none" onclick="disconnectWallet()">
        断开
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" id="mainContent">
    <!-- Content loaded dynamically via JS -->
  </main>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar" id="nav">
    <button class="tab-bar-item active" data-tool="batch-transfer">
      <span class="tab-bar-icon">📤</span>
      <span class="tab-bar-label">转账</span>
    </button>
    <button class="tab-bar-item" data-tool="balance-check">
      <span class="tab-bar-icon">💰</span>
      <span class="tab-bar-label">余额</span>
    </button>
    <button class="tab-bar-item" data-tool="nft-market">
      <span class="tab-bar-icon">🏪</span>
      <span class="tab-bar-label">市场</span>
    </button>
    <button class="tab-bar-item" data-tool="tx-tracker">
      <span class="tab-bar-icon">🔍</span>
      <span class="tab-bar-label">追踪</span>
    </button>
    <button class="tab-bar-item" data-tool="more">
      <span class="tab-bar-icon">⋯</span>
      <span class="tab-bar-label">更多</span>
    </button>
  </nav>

  <!-- Paxi CosmJS SDK -->
  <script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js"></script>
  <!-- 公共模块：网络配置、交易函数、Gas模拟、交易轮询、错误映射 -->
  <script src="shared.js"></script>
  <!-- SDK 兼容层：补充 PaxiCosmJS 缺失的消息类 -->
  <script src="compat.js"></script>
  <script src="app.js"></script>
  <script>
    // 初始化网络选择器
    renderNetworkSelector('networkSelector');
  </script>
</body>
</html>
