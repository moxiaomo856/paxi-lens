<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Paxi 工具箱</title>
  <meta name="description" content="Paxi Network 生态工具集">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236366f1'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>P</text></svg>">
  <style>
    /* ========== 全局样式 ========== */
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overscroll-behavior-y: none;
    }

    /* ========== Header ========== */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 6px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .header-badge {
      font-size: 10px;
      background: var(--primary);
      color: white;
      padding: 1px 7px;
      border-radius: 100px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .header-right .wallet-balance {
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
      white-space: nowrap;
    }
    .header-right .wallet-address {
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 3px 6px;
      border-radius: 4px;
      font-family: monospace;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-right select {
      font-size: 10px;
      padding: 3px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      max-width: 60px;
    }
    .lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    .lang-btn:active { background: var(--bg-hover); }
    .btn-sm {
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
      min-height: 28px;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:active { background: var(--bg-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ========== Main ========== */
    .main {
      max-width: 500px;
      margin: 0 auto;
      padding: 12px 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
    }

    /* ========== 首页网格 ========== */
    .home-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .tool-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 72px;
      justify-content: center;
    }
    .tool-card:active { background: var(--bg-hover); transform: scale(0.97); }
    .tool-card .icon { font-size: 22px; line-height: 1.2; }
    .tool-card .name { font-size: 11px; font-weight: 600; line-height: 1.3; }

    /* ========== 二级页面返回栏 ========== */
    .back-bar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 12px;
      cursor: pointer;
      padding: 6px 0;
    }
    .back-bar:active { color: var(--text); }

    /* ========== 工具卡片（内部） ========== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .info-box {
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .info-box strong { color: var(--primary); }

    /* ========== Form ========== */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: monospace;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--primary); }
    textarea { min-height: 100px; resize: vertical; font-family: sans-serif; }
    select { cursor: pointer; font-family: sans-serif; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 400px) { .form-row { grid-template-columns: 1fr; } }

    /* ========== Buttons ========== */
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-block { width: 100%; }

    /* ========== Status ========== */
    .status-msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
      display: none;
      word-break: break-word;
    }
    .status-msg.success { background: rgba(34,197,94,0.15); color: var(--success); display: block; }
    .status-msg.error { background: rgba(239,68,68,0.15); color: var(--danger); display: block; }
    .status-msg.info { background: rgba(99,102,241,0.15); color: var(--primary); display: block; }
    .status-msg.warning { background: rgba(245,158,11,0.15); color: var(--warning); display: block; }

    /* ========== Stats ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }

    /* ========== Tabs ========== */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab {
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .tab:active { color: var(--text); }
    .tab.active { color: var(--primary); background: rgba(99,102,241,0.15); border-color: var(--primary); }

    /* ========== Table ========== */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left;
      padding: 6px 8px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    td { padding: 6px 8px; border-bottom: 1px solid var(--border); }

    /* ========== Upload ========== */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-muted);
    }
    .upload-area:active { border-color: var(--primary); color: var(--text); }
    .upload-area.dragover { border-color: var(--primary); background: rgba(99,102,241,0.08); }

    /* ========== Spinner ========== */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      animation: slideUp 0.3s ease;
      box-shadow: var(--shadow);
      max-width: 90vw;
      text-align: center;
    }
    @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* ========== Misc ========== */
    code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--primary); }
    .sub-tabs {
      display: flex;
      gap: 0;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 4px;
    }
    .sub-tab {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .sub-tab.active { color: var(--text); background: var(--bg-hover); }
    .nft-market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .nft-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .nft-card-img {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .nft-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .nft-card-placeholder { font-size: 32px; color: var(--text-muted); }
    .nft-card-body { padding: 10px; }
    .nft-card-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nft-card-meta { font-size: 10px; color: var(--text-muted); }
    .nft-card-price { font-size: 14px; font-weight: 800; color: var(--primary); margin: 4px 0; }
    .nft-card-seller { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
    .nft-card-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(99,102,241,0.15); }
    .listing-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }
    .listing-item-main { flex: 1; min-width: 140px; }
    .listing-item-name { font-weight: 700; font-size: 13px; }
    .listing-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .listing-item-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .buy-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 16px;
    }
    .buy-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .buy-step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--text-muted);
    }
    .buy-step.active .buy-step-num { border-color: var(--primary); color: var(--primary); }
    .buy-step.done .buy-step-num { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.15); }
    .buy-step-label { font-size: 10px; color: var(--text-muted); }
    .buy-step.active .buy-step-label { color: var(--primary); }
    .buy-step-line { flex: 1; height: 2px; background: var(--border); max-width: 30px; }
    .buy-step-line.done { background: var(--success); }
    .price-breakdown {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }
    .price-row.total {
      border-top: 1px solid var(--border);
      margin-top: 4px;
      padding-top: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .copy-box { margin-bottom: 12px; }
    .copy-row { display: flex; gap: 6px; align-items: center; }
    .nft-preview-box {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
    }
    .nft-buy-detail { text-align: center; margin-bottom: 16px; }

    /* ========== P2P 市场样式 ========== */
    .p2p-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-left: 4px solid var(--border);
      transition: all 0.15s;
    }
    .p2p-item.buy { border-left-color: var(--success); }
    .p2p-item.sell { border-left-color: var(--warning); }
    .p2p-item .p2p-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .p2p-item .p2p-type {
      font-weight: 700;
      font-size: 13px;
    }
    .p2p-item .p2p-type.buy { color: var(--success); }
    .p2p-item .p2p-type.sell { color: var(--warning); }
    .p2p-item .p2p-body {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      margin: 4px 0;
    }
    .p2p-item .p2p-body .label { color: var(--text-muted); font-size: 11px; }
    .p2p-item .p2p-contact {
      font-size: 12px;
      color: var(--primary);
      word-break: break-all;
    }
    .p2p-item .p2p-time {
      font-size: 10px;
      color: var(--text-muted);
    }
    .p2p-item .p2p-addr {
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* ========== Mobile ========== */
    @media (max-width: 767px) {
      .header-left { width: 100%; justify-content: center; }
      .header-right { width: 100%; justify-content: center; }
    }
    /* ========== Desktop ========== */
    @media (min-width: 768px) {
      .home-grid { grid-template-columns: repeat(4, 1fr); }
      .nft-market-grid { grid-template-columns: repeat(3, 1fr); }
      .main { padding: 20px 16px; }
      .header-title { font-size: 17px; }
      .tool-card { padding: 18px 10px; min-height: 80px; }
      .tool-card .icon { font-size: 26px; }
      .tool-card .name { font-size: 13px; }
    }
    @media (max-width: 360px) {
      .home-grid { gap: 8px; }
      .tool-card { padding: 12px 4px; min-height: 68px; }
      .tool-card .icon { font-size: 20px; }
      .tool-card .name { font-size: 10px; }
      .header-right .wallet-address { max-width: 60px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-left">
    <div class="logo">P</div>
    <div>
      <div class="header-title" id="appTitle">paxi工具箱</div>
    </div>
    <span class="header-badge">1.0</span>
  </div>
  <div class="header-right">
    <span class="wallet-balance" id="walletBalance" style="display:none"></span>
    <span class="wallet-address" id="walletAddress" style="display:none"></span>
    <span id="networkSelector"></span>
    <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">中/english</button>
    <button class="btn btn-primary btn-sm" id="btnConnect" onclick="connectWallet()">连接钱包</button>
    <button class="btn btn-outline btn-sm" id="btnDisconnect" style="display:none" onclick="disconnectWallet()">断开</button>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="main" id="mainContent">
  <!-- 动态渲染 -->
</main>

<!-- ===== SCRIPTS ===== -->
<script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js"></script>
<script src="shared.js"></script>
<script src="compat.js"></script>
<script src="app.js"></script>
<script>
  // 初始化网络选择器（主网/测试网）
  renderNetworkSelector('networkSelector');
</script>
</body>
</html>
